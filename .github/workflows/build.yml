name: Build NEXORA

on:
  push:
    branches: [ main, nexora-update ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Release
        run: msbuild NEXORA/NEXORA.sln /m /p:Configuration=Release /p:Platform="Any CPU"
